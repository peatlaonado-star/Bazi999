<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="50%" stop-color="#D6AD45"/>
      <stop offset="100%" stop-color="#F4D987"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g stroke="url(#goldGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)">
    <!-- Triangle base + horizontal beam + two pans (semicircles) -->
    <path d="M 40 78 L 50 50 L 60 78 Z"/>
    <line x1="25" y1="42" x2="75" y2="42"/>
    <line x1="35" y1="42" x2="35" y2="58"/>
    <line x1="65" y1="42" x2="65" y2="58"/>
    <path d="M 25 58 Q 35 70 45 58"/>
    <path d="M 55 58 Q 65 70 75 58"/>  </g>
</svg>