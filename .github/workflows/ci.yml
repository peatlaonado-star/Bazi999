name: CI + Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:js
      - run: npm run build

  # CF Pages GitHub webhook is unreliable in this project (deploys show
  # type=ad_hoc), so the local post-commit hook in .git/hooks/post-commit
  # is the primary deploy mechanism. This job is a SAFETY NET for commits
  # made directly on GitHub.com (no local hook). Skipped silently if
  # secrets are not configured — local hook handles all real deploys.
  deploy:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't fail the workflow if CF API is unreachable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Trigger Cloudflare Pages deploy (if secrets configured)
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_KEY" ]; then
            echo "⏭️  CLOUDFLARE_API_KEY not set — skipping (local post-commit hook handles deploys)"
            exit 0
          fi
          COMMIT=$(git rev-parse HEAD)
          echo "🚀 Triggering deploy for commit ${COMMIT:0:10}..."
          RESP=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/starvia/deployments" \
            -H "X-Auth-Email: ${CLOUDFLARE_EMAIL}" \
            -H "X-Auth-Key: ${CLOUDFLARE_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"deployment_trigger\":{\"type\":\"ad_hoc\",\"metadata\":{\"branch\":\"main\",\"commit_hash\":\"${COMMIT}\"}}}")
          echo "$RESP" | python3 -m json.tool || echo "raw: $RESP"
          DEPLOY_ID=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('result',{}).get('id','?'))" 2>/dev/null || echo "?")
          echo "✅ Deploy ID: $DEPLOY_ID"
