<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starvia Analytics Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Sarabun", sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #e0e0e0;
      min-height: 100vh;
      padding: 24px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #C9A227, #f0d96a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 32px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 20px;
    }
    .card-label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
    .card-value { font-size: 32px; font-weight: 700; color: #C9A227; }
    .card-sub { font-size: 11px; color: #666; margin-top: 4px; }
    .section { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
    .section h2 { font-size: 18px; margin-bottom: 16px; color: #f0d96a; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.06); }
    th { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.1em; }
    td.event { font-family: 'SF Mono', Monaco, monospace; font-size: 13px; color: #e0e0e0; }
    td.count { font-size: 16px; font-weight: 600; color: #C9A227; text-align: right; }
    .funnel { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .funnel-name { min-width: 180px; font-size: 14px; }
    .funnel-bar { flex: 1; height: 24px; background: rgba(255,255,255,0.04); border-radius: 4px; overflow: hidden; position: relative; }
    .funnel-fill { height: 100%; background: linear-gradient(90deg, #8B6914, #C9A227); border-radius: 4px; transition: width 0.5s; }
    .funnel-pct { min-width: 60px; text-align: right; font-weight: 600; color: #f0d96a; }
    .empty { text-align: center; padding: 40px; color: #666; }
    .refresh-btn {
      background: linear-gradient(135deg, #8B6914, #C9A227);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
    }
    .refresh-btn:hover { opacity: 0.9; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .meta { font-size: 11px; color: #666; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <h1>📊 Starvia Analytics</h1>
      <button class="refresh-btn" onclick="loadData()">🔄 Refresh</button>
    </div>
    <div class="subtitle">Local counters — สะสมตั้งแต่ clear browser. Production ใช้ umami (cloud.umami.is)</div>

    <div class="grid" id="kpi-grid"></div>

    <div class="section">
      <h2>🎯 Conversion Funnel</h2>
      <div id="funnel"></div>
    </div>

    <div class="section">
      <h2>📋 All Events</h2>
      <table>
        <thead>
          <tr><th>Event</th><th>Count</th></tr>
        </thead>
        <tbody id="events-table"></tbody>
      </table>
    </div>

    <div class="meta">Updated: <span id="updated-at">-</span> · User agent: <span id="ua"></span></div>
  </div>

  <script>
    function loadData() {
      const data = window.StarviaAnalytics ? window.StarviaAnalytics.getCounters() : {};
      const events = window.StarviaAnalytics ? window.StarviaAnalytics.events : [];

      // KPI cards
      const kpis = [
        { label: 'Birthday Submitted', value: data.birthday_submitted || 0, sub: 'ผู้ใช้กรอกวันเกิด' },
        { label: 'Reading Viewed', value: data.reading_viewed || 0, sub: 'เปิดดูคำทำนาย' },
        { label: 'Premium CTA', value: data.premium_cta_clicked || 0, sub: 'กดปุ่มพรีเมียม' },
        { label: 'Payment Initiated', value: data.payment_initiated || 0, sub: 'เริ่มจ่ายเงิน' },
        { label: 'PIN Verified', value: data.pin_verified || 0, sub: 'PIN ถูก' },
        { label: 'Share Initiated', value: data.share_initiated || 0, sub: 'กดแชร์' },
        { label: 'Chat Opened', value: data.chat_opened || 0, sub: 'เปิดแชท' },
      ];

      document.getElementById('kpi-grid').innerHTML = kpis.map((k) => `
        <div class="card">
          <div class="card-label">${k.label}</div>
          <div class="card-value">${k.value.toLocaleString()}</div>
          <div class="card-sub">${k.sub}</div>
        </div>
      `).join('');

      // Conversion funnel
      const funnelSteps = [
        { name: 'Birthday Submitted', key: 'birthday_submitted' },
        { name: 'Reading Viewed', key: 'reading_viewed' },
        { name: 'Premium CTA Clicked', key: 'premium_cta_clicked' },
        { name: 'Payment Initiated', key: 'payment_initiated' },
        { name: 'Payment Completed', key: 'payment_completed' },
      ];
      const maxVal = Math.max(...funnelSteps.map((s) => data[s.key] || 0), 1);
      const topVal = data[funnelSteps[0].key] || 0;
      document.getElementById('funnel').innerHTML = funnelSteps.map((s) => {
        const val = data[s.key] || 0;
        const width = maxVal ? (val / maxVal) * 100 : 0;
        const pct = topVal ? ((val / topVal) * 100).toFixed(1) : '0.0';
        return `
          <div class="funnel">
            <div class="funnel-name">${s.name}</div>
            <div class="funnel-bar"><div class="funnel-fill" style="width:${width}%"></div></div>
            <div class="funnel-pct">${val} (${pct}%)</div>
          </div>
        `;
      }).join('');

      // All events table
      const sorted = events.map((e) => ({ name: e, count: data[e] || 0 }))
        .sort((a, b) => b.count - a.count);
      const total = sorted.reduce((sum, e) => sum + e.count, 0);
      document.getElementById('events-table').innerHTML = sorted.map((e) => `
        <tr>
          <td class="event">${e.name}</td>
          <td class="count">${e.count.toLocaleString()}</td>
        </tr>
      `).join('') + `
        <tr style="border-top: 2px solid rgba(255,255,255,0.1);">
          <td class="event" style="color:#f0d96a;font-weight:600">TOTAL</td>
          <td class="count" style="color:#f0d96a">${total.toLocaleString()}</td>
        </tr>
      `;

      document.getElementById('updated-at').textContent = new Date().toLocaleString('th-TH');
      document.getElementById('ua').textContent = navigator.userAgent.split(' ').slice(-2).join(' ');
    }

    // Auto-refresh every 5s
    loadData();
    setInterval(loadData, 5000);
  </script>
</body>
</html>
