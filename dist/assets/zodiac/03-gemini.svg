<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Gemini ♊ — ultra bold, solid gold fill, no filters -->
  <rect width="100" height="100" rx="16" fill="#1a1030"/>
  <!-- Left pillar -->
  <rect x="30" y="16" width="10" height="68" rx="5" fill="#D4AF37"/>
  <!-- Right pillar -->
  <rect x="60" y="16" width="10" height="68" rx="5" fill="#D4AF37"/>
  <!-- Top bar -->
  <rect x="22" y="12" width="56" height="8" rx="4" fill="#D4AF37"/>
  <!-- Bottom bar -->
  <rect x="22" y="80" width="56" height="8" rx="4" fill="#D4AF37"/>
  <!-- Top outer flares -->
  <rect x="18" y="8" width="12" height="6" rx="3" fill="#E8C85A"/>
  <rect x="70" y="8" width="12" height="6" rx="3" fill="#E8C85A"/>
  <!-- Bottom outer flares -->
  <rect x="18" y="86" width="12" height="6" rx="3" fill="#E8C85A"/>
  <rect x="70" y="86" width="12" height="6" rx="3" fill="#E8C85A"/>
  <!-- Center accent diamond -->
  <polygon points="50,30 58,44 50,58 42,44" fill="#F4D987" opacity="0.35"/>
</svg>
