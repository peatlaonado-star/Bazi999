<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="gg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="40%" stop-color="#E8C85A"/>
      <stop offset="100%" stop-color="#F4D987"/>
    </linearGradient>
    <filter id="gs" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Gemini ♊ — bold two pillars with decorative caps -->
  <g stroke="url(#gg)" stroke-linecap="round" stroke-linejoin="round" filter="url(#gs)">
    <!-- Left pillar -->
    <line x1="42" y1="22" x2="42" y2="98" stroke-width="5"/>
    <!-- Right pillar -->
    <line x1="78" y1="22" x2="78" y2="98" stroke-width="5"/>
    <!-- Top bar — arch with outward flare -->
    <line x1="26" y1="22" x2="94" y2="22" stroke-width="4.5"/>
    <line x1="26" y1="18" x2="34" y2="22" stroke-width="3"/>
    <line x1="94" y1="18" x2="86" y2="22" stroke-width="3"/>
    <!-- Bottom bar — arch with outward flare -->
    <line x1="26" y1="98" x2="94" y2="98" stroke-width="4.5"/>
    <line x1="26" y1="102" x2="34" y2="98" stroke-width="3"/>
    <line x1="94" y1="102" x2="86" y2="98" stroke-width="3"/>
    <!-- Center diamond accent -->
    <polygon points="60,42 68,52 60,62 52,52" stroke-width="2.5" fill="url(#gg)" fill-opacity="0.2"/>
  </g>
</svg>
