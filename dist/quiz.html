<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ทดสอบธาตุประจำตัว — STARVIA</title>
  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0a1a;
      color: #e8e8f0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===== COSMIC BACKGROUND ===== */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(123,104,238,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(201,162,39,0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(123,104,238,0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* ===== STAR PARTICLES (CSS only) ===== */
    .stars {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      overflow: hidden;
    }
    .star {
      position: absolute;
      width: 2px; height: 2px;
      background: #fff;
      border-radius: 50%;
      animation: twinkle var(--dur, 3s) ease-in-out infinite alternate;
      opacity: 0.3;
    }
    @keyframes twinkle { 0% { opacity: 0.1; } 100% { opacity: 0.7; } }

    /* ===== LAYOUT ===== */
    .container {
      position: relative; z-index: 1;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px 16px;
      min-height: 100vh;
      display: flex; flex-direction: column;
    }

    /* ===== HEADER ===== */
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: #C9A227;
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 20px;
      transition: color 0.3s;
    }
    .back-link:hover { color: #e0b830; }

    /* ===== SCREENS ===== */
    .screen { display: none; flex-direction: column; flex: 1; }
    .screen.active { display: flex; animation: fadeSlideIn 0.5s ease; }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== START SCREEN ===== */
    .start-screen {
      align-items: center; justify-content: center; text-align: center;
      gap: 24px;
    }
    .start-icon {
      font-size: 4rem;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .start-title {
      font-size: 1.8rem;
      background: linear-gradient(135deg, #C9A227, #e0d070);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.3;
    }
    .start-subtitle {
      color: #aaa;
      font-size: 1rem;
      max-width: 320px;
    }

    /* ===== BUTTONS ===== */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 14px 36px;
      border: none; border-radius: 50px;
      font-size: 1.1rem; font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #C9A227, #e0b830);
      color: #0a0a1a;
      box-shadow: 0 4px 20px rgba(201,162,39,0.3);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px rgba(201,162,39,0.5);
    }
    .btn-outline {
      background: transparent;
      border: 2px solid #C9A227;
      color: #C9A227;
    }
    .btn-outline:hover {
      background: rgba(201,162,39,0.1);
    }
    .btn-share {
      background: linear-gradient(135deg, #7B68EE, #9b8aff);
      color: #fff;
      box-shadow: 0 4px 20px rgba(123,104,238,0.3);
    }
    .btn-share:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px rgba(123,104,238,0.5);
    }

    /* ===== PROGRESS BAR ===== */
    .progress-wrapper {
      margin-bottom: 24px;
    }
    .progress-text {
      text-align: center;
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 8px;
    }
    .progress-bar {
      width: 100%; height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #C9A227, #7B68EE);
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    /* ===== QUESTION SCREEN ===== */
    .question-screen { gap: 16px; }

    .question-number {
      font-size: 0.85rem;
      color: #C9A227;
      text-align: center;
    }

    .question-text {
      font-size: 1.3rem;
      text-align: center;
      line-height: 1.5;
      padding: 8px 0 16px;
      font-weight: 600;
    }

    .options { display: flex; flex-direction: column; gap: 12px; }

    .option-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 16px 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1rem;
      text-align: left;
      color: #e8e8f0;
      line-height: 1.4;
    }
    .option-card:hover {
      background: rgba(201,162,39,0.1);
      border-color: rgba(201,162,39,0.3);
      transform: translateX(4px);
    }
    .option-card:active {
      transform: scale(0.98);
    }
    .option-card.selected {
      background: rgba(201,162,39,0.15);
      border-color: #C9A227;
      box-shadow: 0 0 20px rgba(201,162,39,0.1);
    }

    /* ===== RESULT SCREEN ===== */
    .result-screen {
      align-items: center;
      text-align: center;
      gap: 20px;
      padding-bottom: 40px;
    }

    .result-emoji {
      font-size: 5rem;
      animation: resultPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes resultPop {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .result-title {
      font-size: 1.6rem;
      background: linear-gradient(135deg, #C9A227, #e0d070);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: fadeSlideIn 0.6s ease 0.2s both;
    }

    .result-subtitle {
      font-size: 1.1rem;
      color: #7B68EE;
      font-weight: 600;
      animation: fadeSlideIn 0.6s ease 0.3s both;
    }

    .result-description {
      color: #bbb;
      font-size: 0.95rem;
      line-height: 1.7;
      max-width: 400px;
      animation: fadeSlideIn 0.6s ease 0.4s both;
    }

    /* Result detail cards */
    .result-details {
      width: 100%;
      display: flex; flex-direction: column; gap: 12px;
      animation: fadeSlideIn 0.6s ease 0.5s both;
    }
    .detail-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 14px 18px;
      text-align: left;
    }
    .detail-card h4 {
      font-size: 0.85rem;
      color: #C9A227;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .detail-card p, .detail-card ul {
      font-size: 0.9rem;
      color: #ccc;
      line-height: 1.5;
    }
    .detail-card ul {
      list-style: none;
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .detail-card ul li {
      background: rgba(123,104,238,0.12);
      border: 1px solid rgba(123,104,238,0.2);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.82rem;
    }

    .result-quote {
      font-style: italic;
      color: #999;
      font-size: 0.9rem;
      line-height: 1.6;
      max-width: 380px;
      padding: 16px;
      border-left: 3px solid #C9A227;
      text-align: left;
      animation: fadeSlideIn 0.6s ease 0.6s both;
    }

    .result-actions {
      display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
      animation: fadeSlideIn 0.6s ease 0.7s both;
    }

    /* ===== TOAST ===== */
    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: rgba(201,162,39,0.9);
      color: #0a0a1a;
      padding: 10px 24px;
      border-radius: 24px;
      font-size: 0.9rem;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 100;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }

    /* ===== RESPONSIVE ===== */
    @media (min-width: 600px) {
      .start-title { font-size: 2.2rem; }
      .question-text { font-size: 1.5rem; }
      .option-card { font-size: 1.05rem; padding: 18px 24px; }
    }
  </style>
</head>
<body>

<!-- Star particles -->
<div class="stars" id="stars"></div>

<div class="container">
  <!-- ===== START SCREEN ===== -->
  <a href="/" class="back-link">← กลับหน้าหลัก STARVIA</a>

  <div class="screen start-screen active" id="screen-start">
    <div class="start-icon">✨</div>
    <h1 class="start-title">ทดสอบธาตุประจำตัว</h1>
    <p class="start-subtitle">10 คำถามค้นหาธาตุที่แท้จริงของคุณ</p>
    <button class="btn btn-primary" onclick="startQuiz()">
      เริ่มทำนาย 🚀
    </button>
  </div>

  <!-- ===== QUESTION SCREEN ===== -->
  <div class="screen question-screen" id="screen-question">
    <div class="progress-wrapper">
      <div class="progress-text" id="progress-text">คำถาม 1 / 10</div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:10%"></div></div>
    </div>
    <p class="question-text" id="question-text"></p>
    <div class="options" id="options-container"></div>
  </div>

  <!-- ===== RESULT SCREEN ===== -->
  <div class="screen result-screen" id="screen-result">
    <div class="result-emoji" id="result-emoji"></div>
    <h2 class="result-title" id="result-title"></h2>
    <p class="result-subtitle" id="result-subtitle"></p>
    <p class="result-description" id="result-description"></p>

    <div class="result-details" id="result-details"></div>

    <blockquote class="result-quote" id="result-quote"></blockquote>

    <div class="result-actions">
      <button class="btn btn-primary" onclick="retakeQuiz()">ทำนายอีกครั้ง 🔄</button>
      <button class="btn btn-share" onclick="shareResult()">แชร์ผลลัพธ์ 📤</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">คัดลอกแล้ว! 📋</div>

<!-- Load quiz data -->
<script src="data/element-quiz.js"></script>

<script>
(function() {
  // ===== STARS =====
  var starsEl = document.getElementById('stars');
  for (var i = 0; i < 60; i++) {
    var s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.setProperty('--dur', (2 + Math.random() * 4) + 's');
    s.style.animationDelay = (Math.random() * 3) + 's';
    s.style.width = s.style.height = (1 + Math.random() * 2) + 'px';
    starsEl.appendChild(s);
  }

  // ===== ELEMENT EMOJI MAP =====
  var elementEmoji = {
    'ไฟ': '🔥',
    'น้ำ': '💧',
    'ลม': '💨',
    'ดิน': '🪨'
  };

  // ===== STATE =====
  var currentQ = 0;
  var answers = [];
  var quizData = window.ELEMENT_QUIZ;

  // ===== DOM REFS =====
  var screenStart = document.getElementById('screen-start');
  var screenQuestion = document.getElementById('screen-question');
  var screenResult = document.getElementById('screen-result');
  var progressText = document.getElementById('progress-text');
  var progressFill = document.getElementById('progress-fill');
  var questionText = document.getElementById('question-text');
  var optionsContainer = document.getElementById('options-container');
  var resultEmoji = document.getElementById('result-emoji');
  var resultTitle = document.getElementById('result-title');
  var resultSubtitle = document.getElementById('result-subtitle');
  var resultDescription = document.getElementById('result-description');
  var resultDetails = document.getElementById('result-details');
  var resultQuote = document.getElementById('result-quote');

  function showScreen(screen) {
    screenStart.classList.remove('active');
    screenQuestion.classList.remove('active');
    screenResult.classList.remove('active');
    screen.classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ===== START =====
  window.startQuiz = function() {
    currentQ = 0;
    answers = [];
    showScreen(screenQuestion);
    renderQuestion();
  };

  function renderQuestion() {
    var q = quizData.questions[currentQ];
    progressText.textContent = 'คำถาม ' + (currentQ + 1) + ' / ' + quizData.questions.length;
    progressFill.style.width = ((currentQ + 1) / quizData.questions.length * 100) + '%';
    questionText.textContent = q.q;

    optionsContainer.innerHTML = '';
    q.options.forEach(function(opt) {
      var card = document.createElement('div');
      card.className = 'option-card';
      card.textContent = opt.text;
      card.addEventListener('click', function() {
        // Highlight selection
        var allCards = optionsContainer.querySelectorAll('.option-card');
        allCards.forEach(function(c) { c.classList.remove('selected'); });
        card.classList.add('selected');

        // Record answer
        answers.push(opt.element);

        // Short delay then next
        setTimeout(function() {
          currentQ++;
          if (currentQ < quizData.questions.length) {
            // Animate out then in
            screenQuestion.style.animation = 'none';
            screenQuestion.offsetHeight; // reflow
            screenQuestion.style.animation = '';
            renderQuestion();
          } else {
            showResult();
          }
        }, 300);
      });
      optionsContainer.appendChild(card);
    });
  }

  // ===== CALCULATE RESULT =====
  function showResult() {
    // Count elements
    var counts = {};
    answers.forEach(function(el) {
      counts[el] = (counts[el] || 0) + 1;
    });

    // Find max
    var maxCount = 0;
    var topElements = [];
    for (var el in counts) {
      if (counts[el] > maxCount) {
        maxCount = counts[el];
        topElements = [el];
      } else if (counts[el] === maxCount) {
        topElements.push(el);
      }
    }

    // Determine result type
    var resultData;
    var emojiStr = '';

    if (topElements.length === 1) {
      // Single element
      var winner = topElements[0];
      resultData = quizData.results[winner];
      emojiStr = elementEmoji[winner] || '✨';
    } else if (topElements.length === quizData.questions.length) {
      // All 4 elements tied (impossible with 10 questions / 4, but handle)
      resultData = quizData.mixResults['สี่ธาตุ'] || { title: 'สมดุล', subtitle: '', description: 'คุณมีความยืดหยุ่นสูง' };
      emojiStr = '🌈';
    } else if (topElements.length === 3) {
      resultData = quizData.mixResults['สามธาตุ'] || { title: 'สามธาตุ', subtitle: '', description: 'คุณปรับตัวเก่งมาก' };
      emojiStr = '⚡';
    } else {
      // 2 elements tied — try mix
      var sorted = topElements.slice().sort();
      var mixKey1 = sorted[0] + sorted[1];
      var mixKey2 = sorted[1] + sorted[0];
      var mixData = quizData.mixResults[mixKey1] || quizData.mixResults[mixKey2];
      if (mixData) {
        resultData = mixData;
      } else {
        // Fallback: show both elements
        var r1 = quizData.results[sorted[0]];
        var r2 = quizData.results[sorted[1]];
        resultData = {
          title: (r1 ? r1.title : sorted[0]) + ' & ' + (r2 ? r2.title : sorted[1]),
          subtitle: 'ธาตุคู่',
          description: (r1 ? r1.description : '') + '\n\n' + (r2 ? r2.description : '')
        };
      }
      emojiStr = elementEmoji[topElements[0]] + elementEmoji[topElements[1]];
    }

    // Populate result
    resultEmoji.textContent = emojiStr;
    resultTitle.textContent = resultData.title || '';
    resultSubtitle.textContent = resultData.subtitle || '';
    resultDescription.textContent = resultData.description || '';

    // Details cards
    resultDetails.innerHTML = '';

    if (resultData.strengths) {
      var strengthsCard = document.createElement('div');
      strengthsCard.className = 'detail-card';
      strengthsCard.innerHTML = '<h4>💪 จุดแข็ง</h4><ul>' +
        resultData.strengths.map(function(s) { return '<li>' + s + '</li>'; }).join('') + '</ul>';
      resultDetails.appendChild(strengthsCard);
    }
    if (resultData.improvements) {
      var improveCard = document.createElement('div');
      improveCard.className = 'detail-card';
      improveCard.innerHTML = '<h4>🌱 สิ่งที่ควรพัฒนา</h4><ul>' +
        resultData.improvements.map(function(s) { return '<li>' + s + '</li>'; }).join('') + '</ul>';
      resultDetails.appendChild(improveCard);
    }
    if (resultData.compatible) {
      var compatCard = document.createElement('div');
      compatCard.className = 'detail-card';
      compatCard.innerHTML = '<h4>❤️ คู่ธาตุที่เข้ากัน</h4><ul>' +
        resultData.compatible.map(function(s) { return '<li>' + s + '</li>'; }).join('') + '</ul>';
      resultDetails.appendChild(compatCard);
    }

    // Quote
    if (resultData.quote) {
      resultQuote.textContent = '「' + resultData.quote + '」';
      resultQuote.style.display = 'block';
    } else {
      resultQuote.style.display = 'none';
    }

    showScreen(screenResult);
  }

  // ===== RETAKE =====
  window.retakeQuiz = function() {
    startQuiz();
  };

  // ===== SHARE =====
  window.shareResult = function() {
    var counts = {};
    answers.forEach(function(el) {
      counts[el] = (counts[el] || 0) + 1;
    });
    var maxCount = 0;
    var topElements = [];
    for (var el in counts) {
      if (counts[el] > maxCount) {
        maxCount = counts[el];
        topElements = [el];
      } else if (counts[el] === maxCount) {
        topElements.push(el);
      }
    }
    var shareText = '✨ ผลทดสอบธาตุ STARVIA ✨\nธาตุของฉันคือ: ' + topElements.join(' + ') + '\n\nมาทำนายธาตุของคุณกัน! → ';
    var shareUrl = window.location.origin + '/quiz.html';

    if (navigator.share) {
      navigator.share({ title: 'ธาตุประจำตัว STARVIA', text: shareText, url: shareUrl });
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(shareText + shareUrl).then(function() {
        showToast('คัดลอกแล้ว! 📋');
      });
    } else {
      showToast('คัดลอกแล้ว! 📋');
    }
  };

  function showToast(msg) {
    var toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function() { toast.classList.remove('show'); }, 2000);
  }

})();
</script>

</body>
</html>
