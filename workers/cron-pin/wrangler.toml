name = "starvia-cron-pin"
main = "index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cron trigger — every 5 minutes
[triggers]
crons = ["*/5 * * * *"]

# Secrets (set via wrangler secret put):
# STARVIA_ADMIN_JWT_SECRET — for signing admin JWT tokens
# This is the SAME secret used by the Pages admin service
